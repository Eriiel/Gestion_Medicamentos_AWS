# Prueba LOCAL del laboratorio (no es lo que se entrega a AWS).
# Replica la misma topologia: frontend (unico puerto publicado) -> backend (interno) -> postgres (interno).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmacia
      POSTGRES_USER: farmacia_admin
      POSTGRES_PASSWORD: local_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistencia: sobrevive a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia_admin -d farmacia"]
      interval: 3s
      timeout: 3s
      retries: 15
    # Sin "ports": la base no se expone al host, igual que RDS privado.

  backend:
    build: ./backend
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: farmacia
      DB_USER: farmacia_admin
      DB_PASSWORD: local_dev_pass
      DB_SSL: "false"                     # en AWS es "true" (RDS con certificado)
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": solo el frontend puede llegar al backend, igual que en la subred privada.

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend               # en AWS: backend.farmacia.local (Cloud Map)
      DNS_RESOLVER: 127.0.0.11            # DNS interno de Docker; en AWS: 10.0.0.2
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
