<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de Medicamentos</title>
<style>
  :root { --verde:#0f766e; --verde-claro:#ccfbf1; --tinta:#1e293b; --gris:#64748b;
          --borde:#e2e8f0; --rojo:#b91c1c; --ambar:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; color:var(--tinta); background:#f8fafc; }
  header { background:var(--verde); color:#fff; padding:20px 32px; display:flex;
           justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:2px 0 0; opacity:.85; font-size:.9rem; }
  #estado-api { font-size:.85rem; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:20px; }
  main { max-width:1200px; margin:24px auto; padding:0 16px; display:grid;
         grid-template-columns:340px 1fr; gap:24px; align-items:start; }
  section { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:20px; }
  h2 { margin:0 0 16px; font-size:1.1rem; }
  label { display:block; font-size:.85rem; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:6px; font:inherit; }
  input:focus, select:focus, button:focus { outline:2px solid var(--verde); outline-offset:1px; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; gap:8px; align-items:center; margin-top:16px; font-weight:400; }
  .check input { width:auto; }
  button { margin-top:18px; width:100%; padding:11px; background:var(--verde); color:#fff; border:0;
           border-radius:6px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:#115e59; }
  #mensaje { margin-top:12px; font-size:.9rem; min-height:1.2em; color:var(--verde); }
  #mensaje.error { color:var(--rojo); }
  .barra { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .barra h2 { margin:0; }
  .barra input { max-width:320px; }
  #total { color:var(--gris); font-weight:400; font-size:.85rem; margin-left:6px; }
  .tabla { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--borde); white-space:nowrap; }
  th { color:var(--gris); font-weight:600; font-size:.8rem; }
  td small { display:block; color:var(--gris); }
  .badge { padding:3px 8px; border-radius:12px; font-size:.78rem; font-weight:600; }
  .vigente { background:var(--verde-claro); color:var(--verde); }
  .proximo { background:#fef3c7; color:var(--ambar); }
  .vencido { background:#fee2e2; color:var(--rojo); }
  .bajo { color:var(--rojo); font-weight:700; }
  .vacio { text-align:center; color:var(--gris); padding:28px; white-space:normal; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Inventario de Medicamentos</h1>
    <p>Farmacia hospitalaria: control de lotes, vencimientos y existencias</p>
  </div>
  <span id="estado-api">Verificando conexión…</span>
</header>

<main>
  <section>
    <h2>Registrar medicamento</h2>
    <form id="form">
      <label for="nombre">Nombre comercial</label>
      <input id="nombre" name="nombre" required maxlength="120" placeholder="Ej. Panadol 500 mg">

      <label for="principio_activo">Principio activo</label>
      <input id="principio_activo" name="principio_activo" required maxlength="120" placeholder="Ej. Paracetamol">

      <div class="fila">
        <div>
          <label for="presentacion">Presentación</label>
          <select id="presentacion" name="presentacion" required>
            <option>Tableta</option><option>Cápsula</option><option>Jarabe</option>
            <option>Suspensión</option><option>Inyectable</option><option>Crema</option>
          </select>
        </div>
        <div>
          <label for="lote">Lote</label>
          <input id="lote" name="lote" required maxlength="40" placeholder="Ej. L-2026-031">
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="fecha_vencimiento">Vencimiento</label>
          <input id="fecha_vencimiento" name="fecha_vencimiento" type="date" required>
        </div>
        <div>
          <label for="stock">Stock (unidades)</label>
          <input id="stock" name="stock" type="number" min="0" required>
        </div>
      </div>

      <label class="check"><input type="checkbox" name="requiere_receta"> Requiere receta médica</label>
      <button type="submit">Registrar medicamento</button>
      <div id="mensaje" role="status"></div>
    </form>
  </section>

  <section>
    <div class="barra">
      <h2>Medicamentos registrados<span id="total"></span></h2>
      <input id="buscar" type="search" placeholder="Buscar por nombre o principio activo">
    </div>
    <div class="tabla">
      <table>
        <thead>
          <tr><th>ID</th><th>Medicamento</th><th>Presentación</th><th>Lote</th>
              <th>Vencimiento</th><th>Estado</th><th>Stock</th><th>Receta</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API = '/api/medicamentos';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mensaje(txt, error = false) {
  const el = $('#mensaje');
  el.textContent = txt;
  el.className = error ? 'error' : '';
}

function estado(fecha) {
  const dias = Math.ceil((new Date(fecha + 'T00:00:00') - new Date()) / 86400000);
  if (dias < 0) return ['vencido', 'Vencido'];
  if (dias <= 90) return ['proximo', `Vence en ${dias} días`];
  return ['vigente', 'Vigente'];
}

async function verificarApi() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    $('#estado-api').textContent = r.ok ? 'API y base de datos conectadas' : `Sin conexión a la base de datos: ${d.db}`;
  } catch {
    $('#estado-api').textContent = 'API no disponible';
  }
}

async function cargar() {
  try {
    const q = encodeURIComponent($('#buscar').value.trim());
    const r = await fetch(`${API}?q=${q}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    $('#total').textContent = `(${data.length})`;
    $('#tabla').innerHTML = data.length ? data.map(m => {
      const [cls, txt] = estado(m.fecha_vencimiento);
      return `<tr>
        <td>${m.id}</td>
        <td><strong>${esc(m.nombre)}</strong><small>${esc(m.principio_activo)}</small></td>
        <td>${esc(m.presentacion)}</td>
        <td>${esc(m.lote)}</td>
        <td>${m.fecha_vencimiento}</td>
        <td><span class="badge ${cls}">${txt}</span></td>
        <td class="${m.stock < 20 ? 'bajo' : ''}">${m.stock}</td>
        <td>${m.requiere_receta ? 'Sí' : 'No'}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" class="vacio">No hay medicamentos registrados. Usa el formulario para agregar el primero.</td></tr>`;
  } catch (e) {
    mensaje(`No se pudo cargar el inventario: ${e.message}`, true);
  }
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = Object.fromEntries(f);
  body.requiere_receta = f.has('requiere_receta');
  body.stock = Number(body.stock);
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    mensaje(`Medicamento registrado con ID ${d.id}`);
    e.target.reset();
    cargar();
  } catch (err) {
    mensaje(`No se pudo registrar: ${err.message}`, true);
  }
});

let t;
$('#buscar').addEventListener('input', () => { clearTimeout(t); t = setTimeout(cargar, 300); });

verificarApi();
cargar();
</script>
</body>
</html>
